# Data-encoded model-cycle video — canonical template (GEFS-Aerosols column field).
#
# ADAPT for a new dataset:
#   * stage 1 `pattern`  -> the GRIB2 .idx record you want (see references/data-sources.md).
#                           Confirm it matches ONE record with scripts/sample_grib_range.py.
#   * heatmap `vmax`     -> ~p99.9 of the field (sample_grib_range.py prints it).
#   * heatmap `cmap_inline.base` + `units`  -> the palette colormap + physical units.
#   * frame count / cadence -> add/remove inputs+output_names+heatmap inputs together.
#
# Self-updating: date-pathed S3 URLs template with {{cycle_date}}/{{cycle_hour}}.
# 6-hourly cycles, ~9h lag; 3-hourly frames f000..f120 (41 frames, 5-day outlook).
#
# DATA-ENCODED CONTRACT (see references/data-encoded-contract.md):
#   heatmap has data_encoded:true + color_scale_file + a cmap_inline/cmap_file
#   palette (a named --cmap is IGNORED), and NO width/height/basemap. 4K comes
#   from reproject regridding the DATA, not from resizing luma. compose-video
#   has NO preset:sos (it would rescale/average the luma).
stages:
  - stage: process
    command: convert-format
    args:
      format: geotiff
      pattern: 'COLMD:entire atmosphere:.*Particulate organic matter dry'   # ADAPT: the field
      output_dir: /work/tif
      inputs:
        - https://noaa-gefs-pds.s3.amazonaws.com/gefs.{{cycle_date:PT6H:PT9H}}/{{cycle_hour:PT6H:PT9H}}/chem/pgrb2ap25/gefs.chem.t{{cycle_hour:PT6H:PT9H}}z.a2d_0p25.f000.grib2
